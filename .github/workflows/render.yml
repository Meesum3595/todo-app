# .github/workflows/render.yml
name: Render CI/CD Pipeline

on:
  push:
    branches:
      - feature/render

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      # Set your Service ID here (or add it as a repo secret)
      RENDER_SERVICE_ID: srv-d0f9ih6mcj7s73d70uag
      # Tell the CLI it’s running in CI
      CI: true

    steps:
      # 1. Check out the repository
      - name: Check out code
        uses: actions/checkout@v3

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build (if you have a build script)
      - name: Build (if defined)
        run: |
          if grep -q '"build"' package.json; then
            echo "🛠️  Running npm run build"
            npm run build
          else
            echo "⚠️  No build script—skipping"
          fi

      # 5. Install Render CLI v1.1.0
      - name: Install Render CLI
        run: |
          curl -L https://github.com/render-oss/cli/releases/download/v1.1.0/cli_1.1.0_linux_amd64.zip -o render.zip
          unzip render.zip
          sudo mv cli_v1.1.0 /usr/local/bin/render
          render --version

      # 6. Trigger a new deploy
      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          render deploys create $RENDER_SERVICE_ID --output json --confirm

      # 7. Tail the last 5 minutes of logs
      - name: Tail Render logs
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          render logs $RENDER_SERVICE_ID --since 5m --confirm

      # 8. On failure, roll back to the previous deploy
      - name: Roll back on failure
        if: failure()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          render services rollback $RENDER_SERVICE_ID --to previous --confirm
