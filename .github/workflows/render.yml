# .github/workflows/render.yml
name: Render CI/CD Pipeline

on:
  push:
    branches:
      - feature/render

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: srv-d0f9ih6mcj7s73d70uag
      RENDER_WORKSPACE_ID: ${{ secrets.RENDER_WORKSPACE_ID }}
      CI: true

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm ci

      - name: Build (if you have a build script)
        run: |
          if grep -q '"build"' package.json; then
            npm run build
          else
            echo "⚠️  No build script—skipping"
          fi

      - name: Install Render CLI v1.1.0
        run: |
          curl -L https://github.com/render-oss/cli/releases/download/v1.1.0/cli_1.1.0_linux_amd64.zip -o render.zip
          unzip render.zip
          sudo mv cli_v1.1.0 /usr/local/bin/render
          render --version

      - name: Set workspace (non-interactive)
        run: |
          render workspace set $RENDER_WORKSPACE_ID --output json --confirm

      - name: Trigger deploy
        run: |
          render deploys create $RENDER_SERVICE_ID --output json --confirm

      - name: Tail logs
        run: |
          render logs --resources $RENDER_SERVICE_ID --tail --output json

      - name: Roll back on failure
        if: failure()
        run: |
          render services rollback $RENDER_SERVICE_ID --output json --confirm
