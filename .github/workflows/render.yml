# .github/workflows/render.yml
name: Render CI/CD Pipeline

on:
  push:
    branches:
      - feature/render

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - name: Check out repository
        uses: actions/checkout@v3

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build if “build” script exists
      - name: Build (if defined)
        run: |
          if grep -q '"build"' package.json; then
            echo "🛠️  Build script found, running npm run build"
            npm run build
          else
            echo "⚠️  No build script defined, skipping build step"
          fi

      # 5. Install the Render CLI via Render’s official install script
      - name: Install Render CLI
        run: |
          curl -fsSL https://cdn.render.com/cli/install.sh | bash
          echo "CLI version: $(~/.render/bin/render --version)"

      # 6. Deploy to Render
      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          PATH: ${{ runner.tool_cache }}/render/bin:${{ env.PATH }}
        run: |
          render login --api-key $RENDER_API_KEY
          render services deploy srv-d0f9ih6mcj7s73d70uag

      # 7. Tail recent Render logs
      - name: Tail Render logs
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          PATH: ${{ runner.tool_cache }}/render/bin:${{ env.PATH }}
        run: |
          render login --api-key $RENDER_API_KEY
          render logs srv-d0f9ih6mcj7s73d70uag --tail --since 5m

      # 8. Roll back on failure
      - name: Roll back on failure
        if: failure()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          PATH: ${{ runner.tool_cache }}/render/bin:${{ env.PATH }}
        run: |
          render login --api-key $RENDER_API_KEY
          render services rollback srv-d0f9ih6mcj7s73d70uag --to previous
